name: Release desktop alpha

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        default: 0.1.0-alpha.1
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            value="${GITHUB_REF_NAME#v}"
          else
            value="${INPUT_VERSION}"
          fi
          echo "value=${value}" >> "${GITHUB_OUTPUT}"

  sandbox:
    needs: metadata
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Build and verify first-run sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox
          platforms: linux/arm64
          load: true
          tags: lumen-sandbox
          build-args: LUMEN_SANDBOX_VERSION=${{ needs.metadata.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test bundled MCP server
        run: |
          docker run --rm --entrypoint /bin/bash lumen-sandbox -lc \
            'test -f /opt/lumen/mcp/computer-use/dist/index.js && test -d /opt/lumen/mcp/computer-use/node_modules && test ! -d /opt/lumen/mcp/computer-use/node_modules/typescript'
          docker run --rm \
            --volume "${PWD}/packaging/smoke_sandbox.mjs:/opt/lumen/smoke_sandbox.mjs:ro" \
            --entrypoint node lumen-sandbox /opt/lumen/smoke_sandbox.mjs

  macos:
    needs: [metadata, sandbox]
    runs-on: macos-14
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-desktop.txt

      - name: Run tests
        run: pytest

      - name: Import optional Developer ID certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          echo "${MACOS_CERTIFICATE_P12}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security create-keychain -p actions "${RUNNER_TEMP}/lumen.keychain-db"
          security set-keychain-settings -lut 21600 "${RUNNER_TEMP}/lumen.keychain-db"
          security unlock-keychain -p actions "${RUNNER_TEMP}/lumen.keychain-db"
          security import "${RUNNER_TEMP}/certificate.p12" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 \
            -k "${RUNNER_TEMP}/lumen.keychain-db"
          security list-keychain -d user -s "${RUNNER_TEMP}/lumen.keychain-db"

      - name: Build Apple Silicon DMG
        env:
          LUMEN_BUILD_VERSION: ${{ needs.metadata.outputs.version }}
          LUMEN_BUILD_NUMBER: ${{ github.run_number }}
        run: packaging/build_macos.sh

      - name: Smoke-test frozen app without system Python
        env:
          LUMEN_DESKTOP_SMOKE_TEST: "1"
          LUMEN_DESKTOP_NO_BROWSER: "1"
        run: "dist/Lumen AI Chat.app/Contents/MacOS/Lumen AI Chat"

      - name: Notarize when Apple credentials are configured
        if: env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != '' && env.MACOS_SIGN_IDENTITY != ''
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          dmg="dist/Lumen-AI-Chat-${VERSION}-apple-silicon.dmg"
          xcrun notarytool submit "${dmg}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --wait
          xcrun stapler staple "${dmg}"
          filename="$(basename "${dmg}")"
          cd dist
          shasum -a 256 "${filename}" > "${filename}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-AI-Chat-${{ needs.metadata.outputs.version }}-apple-silicon
          path: |
            dist/*.dmg
            dist/*.sha256

      - name: Attach files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.sha256
          generate_release_notes: true

  windows:
    needs: [metadata, sandbox]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-desktop.txt

      - name: Run tests
        run: pytest

      - name: Build Windows x64 application
        env:
          LUMEN_BUILD_VERSION: ${{ needs.metadata.outputs.version }}
          LUMEN_BUILD_NUMBER: ${{ github.run_number }}
        shell: pwsh
        run: .\packaging\build_windows.ps1

      - name: Smoke-test frozen app without system Python
        env:
          LUMEN_DESKTOP_SMOKE_TEST: "1"
          LUMEN_DESKTOP_NO_BROWSER: "1"
          LUMEN_DESKTOP_DATA_DIR: ${{ runner.temp }}\lumen-smoke
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\Lumen AI Chat\Lumen AI Chat.exe" -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-AI-Chat-${{ needs.metadata.outputs.version }}-windows-x64
          path: |
            dist/*-windows-x64.zip
            dist/*-windows-x64.zip.sha256

      - name: Attach files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-windows-x64.zip
            dist/*-windows-x64.zip.sha256
          generate_release_notes: true
